# CI: run the Playwright suite on three browsers and publish one Allure report to GitHub Pages
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege: every job is read-only unless it asks for more
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # Descarga el código fuente del repositorio
      - uses: actions/checkout@v4

      # Set up the Node version pinned in .tool-versions (same file mise reads locally)
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      # Instala todas las dependencias del proyecto (npm install)
      - name: Install dependencies
        run: npm ci

      # Install only the browser this matrix job runs, plus its OS dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Ejecuta las pruebas automatizadas de Playwright
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      # Upload the Playwright HTML report of this browser, for debugging
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      # Upload the raw Allure results; the report job merges the three browsers
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

  report:
    # Runs even when a browser job fails: that is when the report matters most
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      # Installs the Allure CLI at the version pinned in package-lock.json
      - name: Install dependencies
        run: npm ci

      # Put the results of the three browsers into one folder
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Allure needs Java, which the ubuntu-24.04 runner image already ships
      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      # Keep the merged report as an artifact, so pull requests have one too
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Permanent copy of this run: allure/<run_number>/
      - name: Deploy Allure report for this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: allure/${{ github.run_number }}

      # Stable URL that always shows the newest report: allure/latest/
      - name: Deploy Allure report as latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: allure/latest
